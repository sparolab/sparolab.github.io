- title: "GSAT: Geometric Traversability Estimation using Self-supervised Learning with Anomaly Detection for Diverse Terrains"
  authors: "<strong>Dongjin Cho</strong>, Miryeong Park, Juhui Lee, Geonmo Yang, and Younggun Cho"
  abstract: >
    Safe autonomous navigation requires reliable estimation of environmental traversability. 
    Traditional methods have relied on semantic or geometry-based approaches with human-defined thresholds, but these methods often yield unreliable predictions due to the inherent subjectivity of human supervision. 
    While self-supervised approaches enable robots to learn from their own experience, they still face a fundamental challenge: the positive-only learning problem. 
    To address these limitations, recent studies have employed Positive-Unlabeled (PU) learning, where the core challenge is identifying positive samples without explicit negative supervision. 
    In this work, we propose GSAT, which addresses these limitations by constructing a positive hypersphere in latent space to classify traversable regions through anomaly detection without requiring additional prototypes (e.g., unlabeled or negative). Furthermore, our approach employs joint learning of anomaly classification and traversability prediction to more efficiently utilize robot experience. 
    We comprehensively evaluate the proposed framework through ablation studies, validation on heterogeneous real-world robotic platforms, and autonomous navigation demonstrations in simulation environments.  
  session: Thursday, 09:00-10:30 / Interactive Session 5, Hall C / Paper ThI1I.342
  page_link: /research/gsat/
  image: /img/research/paper/19_gsat.png

- title: " Hilti-Trimble SLAM challenge 2026 <span style="color: red; font-weight: 700;">(2nd Place)</span>"
  authors: "<strong>Jungwoo Lee</strong>, Hogyun Kim, Jiwon Choi, Jinyoung Jeong, and Younggun Cho"
  abstract: >
  This report describes our submission to the 2026 Hilti-Trimble SLAM Challenge. 
  The system is a 360-camera visual-inertial pipeline that uses only the provided dual-fisheye image streams and IMU measurements. 
  First, raw images are preprocessed with low-light enhancement~\cite{zdcepp} and static/dynamic masking~\cite{yolo26}, and then fed into a $\sqrt{\text{VINS}}$~\cite{srvins} frontend as the local odometry, with deep learning-based SuperPoint features~\cite{superpoint}, ELSED line segments~\cite{elsed}, and LightGlue matching~\cite{lightglue}. 
  The resulting trajectory is refined using a GTSAM-based backend that performs tightly-coupled factor graph optimization with SALAD global descriptor~\cite{salad} and visual bundle adjustment~(BA)~\cite{smartfactor}. 
  The backend performs local-to-global structureless BA, tightly regularized intrinsic and extrinsic refinement, and global scale adjustment supported by the known inter-camera baseline and cross-view constraints. 
  The design targets long indoor sequences with dark regions, repetitive corridors, dynamic objects, and limited geometric parallax, while keeping the pipeline reproducible in the provided ROS2 workspace.
  Fig.~\ref{fig:pose_plots} demonstrates that our proposed method aligns well with the floorplan across several indoor sequences.
  session: Friday, 11:40-12:10 / Workshop on Open Challenges in Robotics for Asset Inspection and Management (ORCAM)
