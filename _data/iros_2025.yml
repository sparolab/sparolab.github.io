- title: "MUST-Loc: Multi-view Uncertainty-aware Semantic Token Association for Object-level Global Localization"
  abstract: >
    Object-level global localization is highly sensitive to semantic uncertainty from viewpoint variations in open-set scenarios.
    To address this problem, we present MUST-Loc, a multi-view, uncertainty-aware semantic token matching framework.
    The key idea is to aggregate object-level tokens through online updates in the mapping process to form mean–variance descriptors, capturing viewpoint-induced variability while maintaining semantic consistency.
    At the localization query, we compute uncertainty-aware semantic similarity, which down-weights high-variance token dimensions to establish reliable correspondences under semantic ambiguity.
    Finally, the camera pose is estimated by selecting the solution that maximizes the Wasserstein-based alignment score between observed detections and projected landmark hypotheses.
    For rigorous validation, we evaluate on challenging TUM RGB-D sequences with occlusions, label noise, and diverse categories, showing consistent improvements over baselines in association and pose accuracy.
  session: Workshop on Open World Navigation in Human-centric Environments / Monday, 13:15~18:00
  page_link: /research/iros_2025/must-loc/
  image: /research/iros_2025/must-loc/main.png

- title: "CLOI-NAV: Open-World Vision-and-Language Navigation via Complex, Long-horizon Ordered Instructions"
  abstract: >
    Remarkable advances in Vision-Language Models (VLMs) and Large Language Models (LLMs) have accelerated progress in the field of intelligent robotics, enabling embodied agents to perceive, reason, and act in a human-like manner. 
    One of the mainstream challenges in embodied AI is Vision-and-Language Navigation (VLN), where an agent is required to follow natural language instructions to navigate through previously unseen environments using visual observations.
    Despite recent progress, existing VLN approaches often struggle to handle long-horizon and ordered instructions, which are prevalent in realistic navigation scenarios.
    Such instructions involve multiple sequential substeps where later actions depend on earlier completions, requiring contextual order understanding and stepwise execution.
    In this work, we present <em>CLOI-NAV</em>, a framework that performs sequential reasoning to follow navigation instructions in unseen environments while preserving the intended order.
    We evaluate <em>CLOI-NAV</em> using our new instruction datasets featuring sequential dependencies in photorealistic environments.        
    Through extensive experiments, we demonstrate that our method enables more accurate instruction following while maintaining path efficiency, with success rate improving from 26.9 to 88.5 and SPL from 29.3 to 76.4.       
  session: Workshop on Open World Navigation in Human-centric Environments / Monday, 13:15~18:00
  page_link: /research/cloi_nav/
  image: /img/research/paper/13_cloi_nav.png