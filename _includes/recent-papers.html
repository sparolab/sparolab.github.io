<style>
  .recent-paper-card .card {
    transition: filter 0.2s ease;
  }
  .recent-paper-card:hover .card {
    filter: brightness(0.85);
  }

  .paper-card-tag {
    display: inline-block;
    margin: 2px;
    padding: 2px 5px;
    font-size: 0.6rem;
    font-weight: bold;
    border-radius: 5px;
    border: 1px solid transparent;
    color: black;
  }

  .recent-paper-card .card-image-wrapper {
    width: 100%;
    height: 250px;
    overflow: hidden;
  }
  .recent-paper-card .card-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .recent-paper-card .card-title-clamp a,
  .recent-paper-card .card-title-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
</style>

<div id="recent-activities-container" class="columns is-multiline">
  <!-- JavaScript로 동적 생성 -->
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 데이터 수집
  const paperData = {{ site.data.research_paper | jsonify }};
  const projectData = {{ site.data.research_project | jsonify }};

  const allItems = [];

  // Paper 데이터 수집
  paperData.forEach(gallery => {
    if (gallery.title === "Paper") {
      gallery.images.forEach(image => {
        allItems.push({
          ...image,
          type: 'paper',
          date_str: image.pulished_date || ''
        });
      });
    }
  });

  // Project 데이터 수집
  projectData.forEach(gallery => {
    if (gallery.title === "Project") {
      gallery.images.forEach(image => {
        allItems.push({
          ...image,
          type: 'project',
          date_str: image.project_date || ''
        });
      });
    }
  });

  // 날짜 파싱 함수
  function parseDate(dateStr) {
    const months = {
      'Jan': 1, 'Feb': 2, 'Mar': 3, 'Apr': 4, 'May': 5, 'Jun': 6,
      'Jul': 7, 'Aug': 8, 'Sep': 9, 'Oct': 10, 'Nov': 11, 'Dec': 12,
      'January': 1, 'February': 2, 'March': 3, 'April': 4, 'May': 5, 'June': 6,
      'July': 7, 'August': 8, 'September': 9, 'October': 10, 'November': 11, 'December': 12
    };

    // "Oct, 2025" 또는 "May 13, 2024" 형식 파싱
    const parts = dateStr.replace(/,/g, '').split(' ').filter(p => p);
    if (parts.length >= 2) {
      const month = months[parts[0]] || 0;
      const year = parseInt(parts[parts.length - 1]) || 0;
      return { year, month };
    }
    return { year: 0, month: 0 };
  }

  // 날짜순 정렬 (최근순, 같은 달이면 project가 나중)
  allItems.sort((a, b) => {
    const dateA = parseDate(a.date_str);
    const dateB = parseDate(b.date_str);

    // Year 비교 (내림차순)
    if (dateB.year !== dateA.year) {
      return dateB.year - dateA.year;
    }

    // Month 비교 (내림차순)
    if (dateB.month !== dateA.month) {
      return dateB.month - dateA.month;
    }

    // 같은 연월이면 project를 나중에 (paper = 0, project = 1)
    const typeA = a.type === 'paper' ? 0 : 1;
    const typeB = b.type === 'paper' ? 0 : 1;
    return typeB - typeA;
  });

  // 최근 4개만 선택
  const recentItems = allItems.slice(0, 4);

  // 태그 색상 팔레트
  const palette = [
    "#FE72A9", "#FFC872", "#A8E6CF", "#FFD3B6", "#FF8C94", "#DCE775", "#B39CD0", "#FFAB91",
    "#81C784", "#90CAF9", "#F48FB1", "#CE93D8", "#FFB74D", "#4DB6AC", "#BA68C8", "#AED581",
    "#7986CB", "#E57373", "#4FC3F7", "#FFF176", "#A1887F", "#9575CD", "#FF8A65", "#64B5F6",
    "#E0E0E0", "#F06292", "#81D4FA", "#E1BEE7", "#FFF59D", "#AED581", "#7986CB", "#E57373",
    "#4FC3F7", "#4DD0E1", "#FDD835", "#90A4AE", "#FF7043", "#A5D6A7", "#F5F5F5", "#E0F7FA",
    "#FFD54F", "#80CBC4", "#A1887F", "#E6EE9C", "#B2DFDB", "#FFCCBC", "#C5CAE9", "#D1C4E9",
    "#B2EBF2", "#F8BBD0", "#DCEDC8", "#C8E6C9", "#F0F4C3", "#FFCDD2", "#B3E5FC", "#B39DDB",
    "#FFE082", "#FFAB91", "#E6EE9C", "#A7FFEB", "#D7CCC8", "#CFD8DC", "#FFEB3B", "#00BCD4",
    "#CDDC39", "#FF9800", "#8BC34A", "#00ACC1", "#F44336", "#03A9F4", "#673AB7", "#4CAF50",
    "#2196F3", "#9C27B0", "#8BC34A", "#FFC107", "#03A9F4", "#9E9E9E", "#00BCD4", "#4CAF50",
    "#E91E63", "#607D8B", "#3F51B5", "#009688", "#C2185B", "#7B1FA2", "#512DA8", "#1976D2",
    "#0288D1", "#0097A7", "#00796B", "#388E3C", "#689F38", "#AFB42B", "#FBC02D", "#FFA000",
    "#F57C00", "#E64A19", "#5D4037", "#616161", "#455A64"
  ];

  // 모든 태그 수집 및 색상 매핑
  const tagSet = new Set();
  recentItems.forEach(item => {
    if (item.tags) {
      item.tags.forEach(tag => tagSet.add(tag));
    }
  });
  const tagArray = Array.from(tagSet).sort();
  const tagColors = {};
  tagArray.forEach((tag, idx) => {
    tagColors[tag] = palette[idx % palette.length];
  });

  // HTML 생성
  const container = document.getElementById('recent-activities-container');

  recentItems.forEach(item => {
    const column = document.createElement('div');
    column.className = 'column is-3-desktop is-half-tablet is-full-mobile';

    const isExternal = item.page_link && item.page_link.startsWith('http');

    // Project는 Conference, Paper는 Publication으로 표시
    let categoryLabel = item.type === 'project' ? 'Conference' : 'Publication';
    let categoryColor = item.type === 'project' ? '#90CAF9' : '#FFB74D';
    let tagsHtml = `<span class="paper-card-tag" style="background:${categoryColor}; border-color:${categoryColor}; color:black;">${categoryLabel}</span>`;

    let dateHtml = '';
    if (item.pulished_date) {
      dateHtml = `<p style="margin:10px 0; text-align:center; font-size:0.9rem; color:black;">Published: ${item.pulished_date}</p>`;
    } else if (item.project_date) {
      dateHtml = `<p style="margin:10px 0; text-align:center; font-size:0.9rem; color:black;">${item.project_date}</p>`;
    }

    let titleHtml = '';
    if (item.alt_link) {
      titleHtml = `<a href="${item.alt_link}" target="_blank" style="color:#0073e6; text-decoration:none;">[${item.alt || "No Title"}]</a>`;
    } else {
      titleHtml = item.alt || "No Title";
    }
    if (item.paper) {
      titleHtml += ` ${item.paper}`;
    }

    // 저자 처리 - 6명 초과 시 et al. 추가
    let authorsHtml = '';
    if (item.authors) {
      const authorList = item.authors.split(', ');
      if (authorList.length > 6) {
        authorsHtml = authorList.slice(0, 6).join(', ') + ', et al.';
      } else {
        authorsHtml = item.authors;
      }
    }

    column.innerHTML = `
      <div class="recent-paper-card" data-href="${item.page_link}" ${isExternal ? 'data-external="true"' : ''} style="cursor:pointer;">
        <div class="card" style="margin:0 auto; text-align:center; min-height:450px; height:auto; display:flex; flex-direction:column; justify-content:space-between;">
          <div class="card-image-wrapper">
            <img src="${item.link}" alt="${item.alt || ''}">
          </div>
          <div class="card-content" style="padding:10px;">
            <div class="content card-title-clamp" style="text-align:left; font-size:0.9rem; color:black; font-weight:bold;">
              ${titleHtml}
            </div>
            ${authorsHtml ? `<div style="margin-top:5px; font-size:0.7rem; color:gray; text-align:left;">${authorsHtml}</div>` : ''}
          </div>
          <div style="margin-top:auto;">
            ${tagsHtml ? `<div style="text-align:center; margin:2px 0;">${tagsHtml}</div>` : ''}
            <hr style="width:70%; margin:0 auto;">
            ${dateHtml}
          </div>
        </div>
      </div>
    `;

    container.appendChild(column);
  });

  // 카드 클릭 이벤트
  document.querySelectorAll('.recent-paper-card').forEach(card => {
    card.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;
      if (card.dataset.external === 'true') {
        window.open(card.dataset.href, '_blank');
      } else {
        window.location.href = card.dataset.href;
      }
    });

    // 호버 효과
    const cardElement = card.querySelector('.card');
    card.addEventListener('mouseenter', () => {
      cardElement.style.filter = 'brightness(0.85)';
    });
    card.addEventListener('mouseleave', () => {
      cardElement.style.filter = 'brightness(1)';
    });
  });
});
</script>
