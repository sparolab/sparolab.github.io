<style>
  .home-news-section .content ul#home-news-list,
  .home-news-section ul#home-news-list {
    list-style: none;
    margin-left: 0;
    padding-left: 0;
  }

  .home-news-section ul#home-news-list li {
    margin-bottom: 0.15rem;
    line-height: 1.4;
  }

  .home-news-section .content ul#home-news-list li + li {
    margin-top: 0;
  }

  .home-news-section .news-date {
    display: inline-block;
    min-width: 5.2rem;
    text-align: center;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
    margin-right: 7px;
    padding: 2px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.45;
    vertical-align: 1px;
    white-space: nowrap;
    border-radius: 999px;
    background: #f1f1f8;
    color: #010042;
    border: 1.5px solid #010042;
  }
</style>

<div class="home-news-section content">
  <ul id="home-news-list"></ul>

  <div class="has-text-centered mt-4">
    <a class="button is-link is-light" href="{{ '/news/news' | relative_url }}">More News</a>
  </div>
</div>

<script>
(function () {
  const monthMap = {
    jan: 1,
    feb: 2,
    mar: 3,
    apr: 4,
    may: 5,
    jun: 6,
    jul: 7,
    aug: 8,
    sep: 9,
    oct: 10,
    nov: 11,
    dec: 12
  };

  function shortMonth(dateText) {
    if (!dateText) return '';
    const t = String(dateText).trim();
    const first = t.split(/\s+/)[0];
    const rest = t.slice(first.length);
    return first.replace(/[.,]/g, '').slice(0, 3) + '.' + rest;
  }

  function parseDateValue(dateText) {
    if (!dateText) {
      return 0;
    }

    const yearMatch = dateText.match(/(\d{4})/);
    const year = yearMatch ? parseInt(yearMatch[1], 10) : 0;

    const monthMatch = dateText.toLowerCase().match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
    const month = monthMatch ? (monthMap[monthMatch[1]] || 0) : 0;

    return year * 100 + month;
  }

  const allNews = [
    {% for paper in site.data.news.papers %}
      {
        date: {{ paper.date | jsonify }},
        description: {{ paper.description | jsonify }},
        authors: {{ paper.authors | default: '' | jsonify }}
      },
    {% endfor %}
    {% for award in site.data.news.awards %}
      {
        date: {{ award.date | jsonify }},
        description: {{ award.description | jsonify }},
        link: {{ award.link | default: '' | jsonify }}
      },
    {% endfor %}
    {% for project in site.data.news.projects %}
      {
        date: {{ project.date | jsonify }},
        description: {{ project.description | jsonify }}
      },
    {% endfor %}
    {% for person in site.data.news.people %}
      {
        date: {{ person.date | jsonify }},
        description: {{ person.description | jsonify }}
      },
    {% endfor %}
  ];

  allNews.sort((a, b) => parseDateValue(b.date) - parseDateValue(a.date));

  const latestNews = allNews.slice(0, 10);
  const listEl = document.getElementById('home-news-list');

  latestNews.forEach((item) => {
    const li = document.createElement('li');
    const dateBadge = document.createElement('span');
    dateBadge.className = 'news-date';
    dateBadge.textContent = shortMonth(item.date);

    li.appendChild(dateBadge);
    // description 은 신뢰된 사이트 데이터(_data/news.yml)이며 <strong> 등 마크업을
    // 포함할 수 있으므로 텍스트 노드가 아니라 HTML 로 렌더링한다.
    const descSpan = document.createElement('span');
    descSpan.innerHTML = item.description || '';
    li.appendChild(descSpan);

    if (item.authors) {
      const authorStrong = document.createElement('strong');
      authorStrong.style.color = '#1f2a44';
      authorStrong.textContent = ' (' + item.authors + ')';
      li.appendChild(authorStrong);
    }

    if (item.link) {
      const link = document.createElement('a');
      link.href = item.link;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = ' [Read more]';
      li.appendChild(link);
    }

    listEl.appendChild(li);
  });
})();
</script>
